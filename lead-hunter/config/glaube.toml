# Configuração do agente Glaube (Lead Hunter)
[agente]
nome = "Glaube"
servico = "criação de landing pages para empresas"
idioma = "pt-BR"
fuso = "America/Sao_Paulo"

[alvo]
segmento = "lojas de moda e acessórios"
municipio = "Rio de Janeiro"
uf = "RJ"
pais = "Brasil"
meta_diaria = 10
# Bairros percorridos em rodízio (um bloco por dia) para variar a pesquisa.
bairros = [
  "Copacabana", "Ipanema", "Leblon", "Botafogo", "Flamengo", "Tijuca",
  "Vila Isabel", "Méier", "Madureira", "Barra da Tijuca", "Recreio dos Bandeirantes",
  "Campo Grande", "Jacarepaguá", "Freguesia (Jacarepaguá)", "Centro", "Laranjeiras",
  "Grajaú", "Ilha do Governador", "Penha", "Bangu",
]
bairros_por_dia = 4
termos = [
  "loja de roupas femininas", "boutique", "loja de moda masculina",
  "loja de acessórios", "loja de bijuterias", "loja de bolsas", "moda praia",
]

[qualificacao]
pontuacao_minima = 50
# Redes e franquias grandes não são público-alvo (já têm agência/estrutura própria).
excluir_redes = [
  "renner", "c&a", "riachuelo", "marisa", "zara", "farm", "animale", "hering",
  "reserva", "shein", "pernambucanas", "lojas americanas", "centauro", "arezzo",
  "schutz", "osklen", "pandora", "vivara", "chilli beans", "track&field",
  "le lis", "maria filó", "cantão", "richards", "aramis", "youcom", "lupo",
]
# Domínios que indicam "não tem site próprio" (só agregador / rede social / marketplace).
dominios_nao_site = [
  "instagram.com", "facebook.com", "linktr.ee", "linktree", "wa.me", "api.whatsapp.com",
  "beacons.ai", "bio.link", "taplink", "lnk.bio", "mercadolivre.com", "shopee.com",
  "elo7.com", "tiktok.com", "google.com", "business.site", "g.page",
]

[pesos]
sem_site = 35
site_agregador = 30
site_fraco_max = 20
site_nao_verificado = 10
tem_instagram = 15
avaliacoes_10 = 10
avaliacoes_50 = 20
nota_alta = 10          # nota >= 4.3
tem_telefone = 10
